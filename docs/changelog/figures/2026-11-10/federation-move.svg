<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 760 212" role="img" aria-label="On main, federation code lives inside goat-cli, goat and goatbuilder each run part of the procedure, five certificate files are copied to the edge by hand, and the edge and core hosts have no host firewall. On the integration branch, one goat-federation library holds the code, ADR 1225 makes goatbuilder federate the one command, the edge role installs the certificates, and an opt-in host firewall covers the edge and core hosts">
<title>Federation is moving into one goatbuilder command</title>
<desc>On main, federation code lives inside goat-cli, goat and goatbuilder each run part of the procedure, five certificate files are copied to the edge by hand, and the edge and core hosts have no host firewall. On the integration branch, one goat-federation library holds the code, ADR 1225 makes goatbuilder federate the one command, the edge role installs the certificates, and an opt-in host firewall covers the edge and core hosts</desc>
<style>
