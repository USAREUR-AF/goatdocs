<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" preserveAspectRatio="xMidYMid meet" width="1440">
  
  
            <title id="get-fig-title">When the network is cut, both halves keep working independently; when it heals, they reconverge.</title>
            
            <line x1="40" y1="130" x2="320" y2="130" stroke="#1a4b6e" stroke-width="2.4"></line>
            
            <g transform="translate(360,130)">
              <path d="M -40 -8 L -20 4 L -32 14 L -10 24 L -22 36 L 0 32" fill="none" stroke="#8a2e1f" stroke-width="2"></path>
              <text class="annot" x="-15" y="56" text-anchor="middle" fill="#8a2e1f">link cut</text>
            </g>
            
            <line x1="400" y1="130" x2="680" y2="130" stroke="#1a4b6e" stroke-width="2.4"></line>

            
            <g>
              <line class="edge" x1="90" y1="100" x2="90" y2="130"></line>
              <line class="edge" x1="170" y1="100" x2="170" y2="130"></line>
              <line class="edge" x1="250" y1="100" x2="250" y2="130"></line>
              <line class="edge" x1="130" y1="130" x2="130" y2="160"></line>
              <line class="edge" x1="210" y1="130" x2="210" y2="160"></line>
              <circle class="node-fill" cx="90" cy="90" r="10"></circle>
              <rect class="node-fill" x="160" y="80" width="20" height="20"></rect>
              <polygon class="node-fill" points="250,80 260,90 250,100 240,90"></polygon>
              <polygon class="node-fill" points="130,160 138,175 122,175"></polygon>
              <circle class="node-fill" cx="210" cy="170" r="10"></circle>
              <text class="annot" x="170" y="210" text-anchor="middle" fill="#1a4b6e">still working</text>
            </g>

            
            <g>
              <line class="edge" x1="450" y1="100" x2="450" y2="130"></line>
              <line class="edge" x1="530" y1="100" x2="530" y2="130"></line>
              <line class="edge" x1="610" y1="100" x2="610" y2="130"></line>
              <line class="edge" x1="490" y1="130" x2="490" y2="160"></line>
              <line class="edge" x1="570" y1="130" x2="570" y2="160"></line>
              <rect class="node-fill" x="440" y="80" width="20" height="20"></rect>
              <polygon class="node-fill" points="530,80 540,90 530,100 520,90"></polygon>
              <polygon class="node-fill" points="610,80 618,100 602,100"></polygon>
              <circle class="node-fill" cx="490" cy="170" r="10"></circle>
              <rect class="node-fill" x="560" y="160" width="20" height="20"></rect>
              <text class="annot" x="540" y="210" text-anchor="middle" fill="#1a4b6e">still working</text>
            </g>

            
            <path d="M 295 65 C 320 50, 400 50, 425 65" fill="none" stroke="#807c76" stroke-width="1.2" stroke-dasharray="3,4"></path>
            <polygon points="425,65 419,60 419,70" fill="#807c76"></polygon>
            <text class="annot" x="360" y="44" text-anchor="middle">catches up when the link returns</text>
          
</svg>