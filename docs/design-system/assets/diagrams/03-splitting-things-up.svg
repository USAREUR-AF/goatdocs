<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" preserveAspectRatio="xMidYMid meet" width="1440">
  
  
            <title id="splitting-fig-title">Four jobs locked inside one monolithic program, versus four small specialists separately attached to a shared bus.</title>
            
            <g>
              <rect x="40" y="50" width="280" height="160" rx="6" ry="6" fill="#fbf8f3" stroke="#1f1d1a" stroke-width="2"></rect>
              <text class="label-center" x="180" y="38">one program does it all</text>
              <text class="label-center" x="110" y="105" font-weight="500" fill="#1f1d1a">collect</text>
              <text class="label-center" x="250" y="105" font-weight="500" fill="#1f1d1a">display</text>
              <text class="label-center" x="110" y="175" font-weight="500" fill="#1f1d1a">act</text>
              <text class="label-center" x="250" y="175" font-weight="500" fill="#1f1d1a">decide</text>
              
              <line class="edge" x1="135" y1="100" x2="225" y2="100" stroke-dasharray="2,3"></line>
              <line class="edge" x1="135" y1="170" x2="225" y2="170" stroke-dasharray="2,3"></line>
              <line class="edge" x1="110" y1="115" x2="110" y2="160" stroke-dasharray="2,3"></line>
              <line class="edge" x1="250" y1="115" x2="250" y2="160" stroke-dasharray="2,3"></line>
              <text class="count" x="180" y="238">single point of failure</text>
            </g>
            
            <line class="rule" x1="370" y1="40" x2="370" y2="220" stroke-dasharray="3,5"></line>
            
            <g>
              <line x1="425" y1="130" x2="705" y2="130" stroke="#1a4b6e" stroke-width="2.4" fill="none"></line>
              <text class="annot" x="415" y="118" fill="#1a4b6e">shared bus</text>
              <line class="edge" x1="475" y1="95" x2="475" y2="130"></line>
              <line class="edge" x1="550" y1="95" x2="550" y2="130"></line>
              <line class="edge" x1="625" y1="95" x2="625" y2="130"></line>
              <line class="edge" x1="700" y1="95" x2="700" y2="130"></line>
              <circle class="node-fill" cx="475" cy="85" r="10"></circle>
              <rect class="node-fill" x="540" y="75" width="20" height="20"></rect>
              <polygon class="node-fill" points="625,75 635,85 625,95 615,85"></polygon>
              <polygon class="node-fill" points="700,75 708,95 692,95"></polygon>
              <text class="label-center" x="475" y="62">collect</text>
              <text class="label-center" x="550" y="62">display</text>
              <text class="label-center" x="625" y="62">decide</text>
              <text class="label-center" x="700" y="62">act</text>
              <text class="count" x="565" y="238">small specialists, each replaceable on its own</text>
            </g>
          
</svg>