<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" preserveAspectRatio="xMidYMid meet" width="1440">
  
  
            <title id="fits-fig-title">Every connection to the bus is identity-checked at the boundary of GOAT-Net’s encrypted network.</title>
            
            <rect x="40" y="40" width="540" height="200" rx="10" ry="10" fill="none" stroke="#1a4b6e" stroke-width="1.6" stroke-dasharray="6,4"></rect>
            <text class="annot" x="50" y="30" fill="#1a4b6e">GOAT-Net — private + encrypted</text>
            
            <line x1="80" y1="140" x2="540" y2="140" stroke="#1a4b6e" stroke-width="2.4"></line>
            
            <g>
              <line class="edge" x1="140" y1="100" x2="140" y2="140"></line>
              <line class="edge" x1="240" y1="100" x2="240" y2="140"></line>
              <line class="edge" x1="340" y1="100" x2="340" y2="140"></line>
              <line class="edge" x1="440" y1="100" x2="440" y2="140"></line>
              
              <rect x="134" y="130" width="12" height="9" fill="#fbf8f3" stroke="#1a4b6e" stroke-width="1"></rect>
              <rect x="234" y="130" width="12" height="9" fill="#fbf8f3" stroke="#1a4b6e" stroke-width="1"></rect>
              <rect x="334" y="130" width="12" height="9" fill="#fbf8f3" stroke="#1a4b6e" stroke-width="1"></rect>
              <rect x="434" y="130" width="12" height="9" fill="#fbf8f3" stroke="#1a4b6e" stroke-width="1"></rect>
              
              <circle class="node-fill" cx="140" cy="90" r="10"></circle>
              <rect class="node-fill" x="230" y="80" width="20" height="20"></rect>
              <polygon class="node-fill" points="340,80 350,90 340,100 330,90"></polygon>
              <polygon class="node-fill" points="440,80 448,100 432,100"></polygon>
              <text class="annot" x="140" y="68" text-anchor="middle">identity</text>
              <text class="annot" x="240" y="68" text-anchor="middle">identity</text>
              <text class="annot" x="340" y="68" text-anchor="middle">identity</text>
              <text class="annot" x="440" y="68" text-anchor="middle">identity</text>
              
              <line class="edge" x1="200" y1="140" x2="200" y2="180"></line>
              <line class="edge" x1="380" y1="140" x2="380" y2="180"></line>
              <rect x="194" y="140" width="12" height="9" fill="#fbf8f3" stroke="#1a4b6e" stroke-width="1"></rect>
              <rect x="374" y="140" width="12" height="9" fill="#fbf8f3" stroke="#1a4b6e" stroke-width="1"></rect>
              <circle class="node-fill" cx="200" cy="190" r="10"></circle>
              <rect class="node-fill" x="370" y="180" width="20" height="20"></rect>
            </g>
            
            <g>
              <circle class="node-fill" cx="660" cy="140" r="11" stroke="#8a2e1f"></circle>
              <text class="annot" x="660" y="118" text-anchor="middle" fill="#8a2e1f">no identity</text>
              
              <line x1="640" y1="140" x2="585" y2="140" stroke="#8a2e1f" stroke-width="1.4" stroke-dasharray="3,3"></line>
              
              <g transform="translate(580,140)" stroke="#8a2e1f" stroke-width="2">
                <line x1="-6" y1="-6" x2="6" y2="6"></line>
                <line x1="-6" y1="6" x2="6" y2="-6"></line>
              </g>
              <text class="annot" x="660" y="162" text-anchor="middle" fill="#8a2e1f">refused</text>
            </g>
          
</svg>