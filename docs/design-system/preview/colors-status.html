<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../components.css">
<style>
  body { padding: 18px 22px; }
  
</style>
</head><body>

  <div class="row" style="gap:8px;align-items:stretch">
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#34d97e;border:1px solid var(--c-line);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">OK</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#34d97e</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--status-ok-fg</div>
  </div>
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#f4c860;border:1px solid var(--c-line);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">WARN</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#f4c860</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--status-warn-fg</div>
  </div>
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#ff7c69;border:1px solid var(--c-line);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">ERR</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#ff7c69</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--status-err-fg</div>
  </div>
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#7ed1f0;border:1px solid var(--c-line);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">INFO</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#7ed1f0</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--status-info-fg</div>
  </div>
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#9d7fe0;border:1px solid var(--c-line);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">EXP</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#9d7fe0</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--status-exp-fg</div>
  </div>
  </div>
  <div class="tag-meta" style="margin-top:10px">Foreground tokens shown — each pairs with a deep-tint bg of the same family.</div>

</body></html>
