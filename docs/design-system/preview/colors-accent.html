<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../components.css">
<style>
  body { padding: 18px 22px; }
  
</style>
</head><body>

  <div class="row" style="gap:8px;align-items:stretch">
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#0c2e1c;border:1px solid var(--c-line);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">DEEP</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#0c2e1c</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--c-green-deep</div>
  </div>
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#20964f;border:1px solid var(--c-line);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">MID · brand</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#20964f</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--c-green-mid</div>
  </div>
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#34d97e;border:1px solid var(--c-line);box-shadow:var(--glow-soft)"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">HI · active</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#34d97e</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--c-green-hi</div>
  </div>
    
  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div style="height:54px;background:#6cf5a8;border:1px solid var(--c-line);box-shadow:var(--glow-accent)"></div>
    <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-muted);margin-top:6px">FLARE · peak</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">#6cf5a8</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-faint)">--c-green-flare</div>
  </div>
  </div>
  <div class="tag-meta" style="margin-top:10px">Derived from the logo (#20964f). Glow renders on hi + flare only.</div>

</body></html>
