<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../components.css">
<style>
  body { padding: 18px 22px; }
  
</style>
</head><body>

  <div class="stack" style="gap:10px">
    <div class="row" style="gap:14px;font-family:var(--font-mono);font-size:13px;color:var(--fg-body)">
      <span style="color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.06em;font-size:11px;width:90px">fast · 90ms</span>
      <span style="color:var(--fg-muted)">state change · hover · focus</span>
    </div>
    <div class="row" style="gap:14px;font-family:var(--font-mono);font-size:13px;color:var(--fg-body)">
      <span style="color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.06em;font-size:11px;width:90px">base · 140ms</span>
      <span style="color:var(--fg-muted)">surface fades · counter flash</span>
    </div>
    <div class="row" style="gap:14px;font-family:var(--font-mono);font-size:13px;color:var(--fg-body)">
      <span style="color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.06em;font-size:11px;width:90px">slow · 240ms</span>
      <span style="color:var(--fg-muted)">panel entry · drawer slide</span>
    </div>
    <div class="row" style="gap:14px;font-family:var(--font-mono);font-size:13px;color:var(--fg-faint);margin-top:4px">
      <span style="text-transform:uppercase;letter-spacing:0.06em;font-size:11px;width:90px">ease</span>
      <span>cubic-bezier(0.2, 0, 0.2, 1) — near-linear · no overshoot</span>
    </div>
  </div>

</body></html>
