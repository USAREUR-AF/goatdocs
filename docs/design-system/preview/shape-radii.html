<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../components.css">
<style>
  body { padding: 18px 22px; }
  
</style>
</head><body>

  <div class="row" style="gap:18px;align-items:flex-end">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:64px;height:48px;background:var(--bg-card);border:1px solid var(--c-line-2);border-radius:0"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.06em">r-0 · sharp · default</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:64px;height:48px;background:var(--bg-card);border:1px solid var(--c-line-2);border-radius:2px"></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.06em">r-1 · 2px · inputs/btn</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:96px;height:24px;background:var(--c-green-deep);color:var(--fg-accent);border:1px solid var(--fg-accent);border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em">● ONLINE</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.06em">r-pill · status chip only</div>
    </div>
  </div>
  <div class="tag-meta" style="margin-top:12px">Anything else round is wrong. Cards and panels never round.</div>

</body></html>
