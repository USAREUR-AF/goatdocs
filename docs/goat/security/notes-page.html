<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat security: notes and sources</title>
<meta name="description" content="Notes and sources for the goat security page: how each estimate was worked out, and the detail behind each section.">
<link rel="icon" href="{{ICON}}">
<style>
{{CSS}}
.notes { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
.notes h1 { font-size: 34px; margin: 0 0 8px; }
.notes .sub { color: var(--quiet); margin: 0 0 26px; }
.notes nav.toc { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 15.5px; }
.notes section { padding: 34px 0 6px; border-bottom: 1px solid var(--rule); }
.notes section h2 { font-size: 24px; margin: 0 0 12px; }
.notes section h3 { font-size: 17px; margin: 22px 0 8px; }
.notes p, .notes li { font-size: 16.5px; line-height: 1.55; max-width: 44em; }
.notes ul { padding-left: 20px; }
.notes table { border-collapse: collapse; width: 100%; margin: 14px 0 18px; font-size: 15px; }
.notes .tw { overflow-x: auto; }
.notes .tw table { min-width: 620px; }
.notes th, .notes td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
.notes th { font: 700 12.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--quiet); }
.notes .cn { color: var(--quiet); font-size: 14px; }
.notes tr:target td { background: var(--accent-soft); }
.notes td a { overflow-wrap: anywhere; }
.notes .back { display: inline-block; margin: 0 0 22px; }
</style>
</head>
<body>
<main class="notes">
  <a class="back" href="../">&larr; goat security</a>
  <h1>Notes and sources</h1>
  <p class="sub">The detail behind each section of the security page, and how each estimate was worked out.</p>
  <nav class="toc" aria-label="Notes">{{TOC}}</nav>
{{NOTES}}
</main>
</body>
</html>
