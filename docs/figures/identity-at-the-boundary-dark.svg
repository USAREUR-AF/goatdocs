<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, &apos;Noto Sans&apos;, Helvetica, Arial, sans-serif">
<title id="t">Every connection to the bus is identity-checked at the boundary of GOAT-Net’s encrypted network.</title>
<desc id="d">Every connection to the bus is identity-checked at the boundary of GOAT-Net’s encrypted network. 6 systems attach to one shared bus inside the dashed boundary, each through an identity check; a system with no identity is refused at the boundary.</desc>
