<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, &apos;Noto Sans&apos;, Helvetica, Arial, sans-serif">
<title id="t">A person passes two human gates; their machine passes none</title>
<desc id="d">Scenario 01: a sponsor invites a person and sets their machine quota, the person submits the one-time link, the sponsor vouches, a different admin approves, and the person is minted a NetBird key, a Zenoh slot and certificate, an Ory login and a .cbor bundle. Scenario 02: the custodian runs goat machine enroll with node class SENSOR-FEED; the quota set at the invite is the pre-authorization, so there is no human gate, and the machine is minted its own slot, a Zenoh certificate and a single-use NetBird key, with no Ory login and no .cbor bundle.</desc>
<defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#818b98"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0969da"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1a7f37"/></marker><marker id="arrow-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#cf222e"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="24" y="38" font-size="20" fill="#1f2328" text-anchor="start" font-weight="600">A person passes two human gates; their machine passes none</text>
<text x="24" y="62" font-size="14" fill="#59636e" text-anchor="start">One identity grammar and one registry; the gates are the difference.</text>
<text x="24" y="96" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Person, scenario 01: a stranger to prove</text>
<rect x="24" y="108" width="148.8" height="132" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="38" y="134" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Invite</text>
<text x="38" y="158" font-size="14" fill="#1f2328" text-anchor="start">a sponsor sends a</text>
<text x="38" y="178" font-size="14" fill="#1f2328" text-anchor="start">one-time link and</text>
<text x="38" y="198" font-size="14" fill="#1f2328" text-anchor="start">sets tier and</text>
<text x="38" y="218" font-size="14" fill="#1f2328" text-anchor="start">machine quota</text>
<rect x="194.8" y="108" width="148.8" height="132" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="208.8" y="134" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Submit</text>
<text x="208.8" y="158" font-size="14" fill="#1f2328" text-anchor="start">the candidate fills</text>
<text x="208.8" y="178" font-size="14" fill="#1f2328" text-anchor="start">in the link: an</text>
<text x="208.8" y="198" font-size="14" fill="#1f2328" text-anchor="start">inert proposal</text>
<rect x="365.6" y="108" width="148.8" height="132" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="379.6" y="134" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Gate 1: vouch</text>
<text x="379.6" y="158" font-size="14" fill="#1f2328" text-anchor="start">the sponsor</text>
<text x="379.6" y="178" font-size="14" fill="#1f2328" text-anchor="start">approves the</text>
<text x="379.6" y="198" font-size="14" fill="#1f2328" text-anchor="start">proposal</text>
<rect x="536.4" y="108" width="148.8" height="132" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="550.4" y="134" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Gate 2: approve</text>
<text x="550.4" y="158" font-size="14" fill="#1f2328" text-anchor="start">a different admin</text>
<text x="550.4" y="178" font-size="14" fill="#1f2328" text-anchor="start">approves it</text>
<rect x="707.2" y="108" width="148.8" height="132" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="721.2" y="134" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Mint</text>
<text x="721.2" y="158" font-size="14" fill="#1f2328" text-anchor="start">NetBird key,</text>
<text x="721.2" y="178" font-size="14" fill="#1f2328" text-anchor="start">Zenoh slot and</text>
<text x="721.2" y="198" font-size="14" fill="#1f2328" text-anchor="start">cert, Ory login,</text>
<text x="721.2" y="218" font-size="14" fill="#1f2328" text-anchor="start">.cbor bundle</text>
<line x1="173.8" y1="174" x2="192.8" y2="174" stroke="#818b98" stroke-width="1.5" marker-end="url(#arrow-line)"/>
<line x1="344.6" y1="174" x2="363.6" y2="174" stroke="#818b98" stroke-width="1.5" marker-end="url(#arrow-line)"/>
<line x1="515.4" y1="174" x2="534.4" y2="174" stroke="#818b98" stroke-width="1.5" marker-end="url(#arrow-line)"/>
<line x1="686.2" y1="174" x2="705.2" y2="174" stroke="#818b98" stroke-width="1.5" marker-end="url(#arrow-line)"/>
<text x="24" y="270" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Machine, scenario 02: property of a vetted person</text>
<rect x="24" y="282" width="148.8" height="132" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="38" y="308" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Quota</text>
<text x="38" y="332" font-size="14" fill="#1f2328" text-anchor="start">the custodian's</text>
<text x="38" y="352" font-size="14" fill="#1f2328" text-anchor="start">machine quota,</text>
<text x="38" y="372" font-size="14" fill="#1f2328" text-anchor="start">from the invite</text>
<rect x="194.8" y="282" width="490.4" height="132" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="208.8" y="308" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">goat machine enroll</text>
<text x="208.8" y="332" font-size="13" fill="#1f2328" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">--node-class SENSOR-FEED</text>
<text x="208.8" y="352" font-size="14" fill="#1f2328" text-anchor="start">no human gate: the quota set at the person's invite is the</text>
<text x="208.8" y="372" font-size="14" fill="#1f2328" text-anchor="start">pre-authorization, so the custodian enrolls their own machine</text>
<rect x="707.2" y="282" width="148.8" height="132" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="721.2" y="308" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Mint</text>
<text x="721.2" y="332" font-size="14" fill="#1f2328" text-anchor="start">own slot, Zenoh</text>
<text x="721.2" y="352" font-size="14" fill="#1f2328" text-anchor="start">cert, NetBird key</text>
<text x="721.2" y="372" font-size="14" fill="#59636e" text-anchor="start">no Ory login</text>
<text x="721.2" y="392" font-size="14" fill="#59636e" text-anchor="start">no .cbor bundle</text>
<line x1="173.8" y1="348" x2="192.8" y2="348" stroke="#818b98" stroke-width="1.5" marker-end="url(#arrow-line)"/>
<line x1="686.2" y1="348" x2="705.2" y2="348" stroke="#818b98" stroke-width="1.5" marker-end="url(#arrow-line)"/>
<text x="24" y="446" font-size="14" fill="#59636e" text-anchor="start">Run it yourself: bin/hg-onboard all --offline</text>
</svg>
