<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 518.3" width="880" height="518.3" role="img" aria-label="A simulated harbour buoy sends three binary messages over UDP port 47200 to its shore station, which receives all 9 datagrams. first-bite reads a copy of every frame off the link, decodes it with the harbour-buoy dictionary built from the interface document HB-ICD-001-A, and publishes one JSON record per message: on ZeroMQ, on a goat fabric where the goat CLI receives them, and as a Cursor-on-Target event."><title>Neither end changes: first-bite decodes a copy and publishes it</title><style>svg{--ink:#191c22; --quiet:#555c68; --rule:#dde1e6; --line:#878f9c; --paper:#ffffff; --panel:#f5f6f8; --accent:#0b5a72; --accent-soft:#e2f0f4; --on-accent:#ffffff; --good:#2a6a35; --good-bg:#e4f3e6; --warn:#875200; --warn-bg:#fcf0d7; --info:#285d9e; --info-bg:#e6eff9; --crit:#b0261d; --crit-bg:#fbeae8; font-family:'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}.t{fill:var(--ink)} .tq{fill:var(--quiet)} .ta{fill:var(--accent)} .tg{fill:var(--good)}
.tw{fill:var(--warn)} .ti{fill:var(--info)} .tc{fill:var(--crit)} .ton{fill:var(--on-accent)}
.bx{fill:var(--panel);stroke:var(--line);stroke-width:1.25} .bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.bxg{fill:var(--good-bg);stroke:var(--good);stroke-width:1.25} .bxc{fill:var(--crit-bg);stroke:var(--crit);stroke-width:1.25}
.bxw{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.25} .bxi{fill:var(--info-bg);stroke:var(--info);stroke-width:1.25}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 5}
.ln{stroke:var(--line);stroke-width:1.5;fill:none} .lna{stroke:var(--accent);stroke-width:2.25;fill:none}
.lng{stroke:var(--good);stroke-width:2;fill:none} .lnc{stroke:var(--crit);stroke-width:2;fill:none;stroke-dasharray:4 4}
.lni{stroke:var(--info);stroke-width:2;fill:none} .lnr{stroke:var(--rule);stroke-width:1;fill:none}
.fa{fill:var(--accent)} .fl{fill:var(--line)} .fg{fill:var(--good)} .fc{fill:var(--crit)} .fi{fill:var(--info)}
.halo{paint-order:stroke fill;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}</style>
<text x="24" y="38" class="t" font-size="20" font-weight="700" data-role="note">Neither end changes: first-bite decodes a copy and publishes it</text>
<text x="24" y="66" class="tq" font-size="15" data-role="note">A simulated harbour buoy sends binary datagrams to its shore station. first-bite reads a copy off the link and puts</text>
<text x="24" y="87" class="tq" font-size="15" data-role="note">every message on a goat fabric as a record.</text>
<rect x="24" y="123" width="214" height="79.3" rx="8" class="bx"/>
<text x="36" y="150" class="t" font-size="15" font-weight="700">Harbour buoy</text>
<text x="36" y="169.7" class="tq" font-size="14">Position, Sea State and</text>
<text x="36" y="189" class="tq" font-size="14">Status messages</text>
<rect x="642" y="123" width="214" height="84.3" rx="8" class="bx"/>
<text x="654" y="150" class="t" font-size="15" font-weight="700">Shore station</text>
<text x="654" y="169.7" class="tq" font-size="14">binds UDP 47200</text>
<text x="654" y="194" class="tq" font-size="14">received 9 of 9</text>
<path d="M239 153L641 153" class="ln"/>
<path d="M641 153L631 158L631 148z" class="fl"/>
<text x="440" y="143" class="tq" font-size="14" text-anchor="middle">UDP 47200, fixed-layout binary</text>
