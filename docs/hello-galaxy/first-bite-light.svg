<rect x="36" y="270.9" width="30" height="30" rx="15" class="fa"/>
<text x="51" y="290.5" class="ton" font-size="13" text-anchor="middle" font-weight="700">3</text>
<text x="74" y="291.3" class="t" font-size="15" font-weight="700">The dictionary</text>
<text x="36" y="317" class="tq" font-size="13" font-family="Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace">harbour-buoy</text>
<text x="36" y="341" class="tq" font-size="14">from HB-ICD-001-A</text>
<text x="36" y="365.3" class="tq" font-size="14">bite new, import-csv, check,</text>
<text x="36" y="384.6" class="tq" font-size="14">lint, coverage, vectors</text>
