<rect x="24" y="481.3" width="30" height="30" rx="15" class="fa"/>
<text x="39" y="500.9" class="ton" font-size="13" text-anchor="middle" font-weight="700">1</text>
<text x="64" y="501.3" class="tq" font-size="14" data-role="note">Alone: bite and mind decode a capture offline, 10 of 10 frames, onto ZeroMQ</text>
