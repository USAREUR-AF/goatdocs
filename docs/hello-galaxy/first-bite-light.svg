<path d="M319 287.3L309 292.3L309 282.3z" class="fl"/>
<rect x="618" y="227.3" width="238" height="117.7" rx="8" class="bx"/>
<rect x="630" y="240.9" width="30" height="30" rx="15" class="fa"/>
<text x="645" y="260.5" class="ton" font-size="13" text-anchor="middle" font-weight="700">4</text>
<text x="668" y="261.3" class="t" font-size="15" font-weight="700">goat fabric</text>
<text x="630" y="288" class="tq" font-size="14">a stand-in router</text>
