<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 448" width="880" height="448" role="img" aria-label="One identity record for raven-03 (uuid e7a9c75b…) is read by three platforms. Its parent moves from falcon-bde to condor-bde by a registry edit, with no new certificate. The uuid does not change; the Zenoh fabric's write namespace and the analytics service's role decision stay the same; the partner C2's releasability changes from no to YES. Asked about an audit event before the reorg, the record still answers falcon-bde."><style>svg{--ink:#191c22; --quiet:#555c68; --rule:#dde1e6; --line:#878f9c; --paper:#ffffff; --panel:#f5f6f8; --accent:#0b5a72; --accent-soft:#e2f0f4; --on-accent:#ffffff; --good:#2a6a35; --good-bg:#e4f3e6; --warn:#875200; --warn-bg:#fcf0d7; --info:#285d9e; --info-bg:#e6eff9; --crit:#b0261d; --crit-bg:#fbeae8; --mute:#5a606a; --mute-bg:#efeeeb; font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}
.t{fill:var(--ink)} .tq{fill:var(--quiet)} .ta{fill:var(--accent)} .tg{fill:var(--good)}
.tw{fill:var(--warn)} .ti{fill:var(--info)} .tc{fill:var(--crit)} .tm{fill:var(--mute)} .ton{fill:var(--on-accent)}
.bx{fill:var(--paper);stroke:var(--line);stroke-width:1.25} .bxp{fill:var(--panel);stroke:var(--rule);stroke-width:1.25}
.bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.25} .bxg{fill:var(--good-bg);stroke:var(--good);stroke-width:1.25}
.bxw{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.25} .bxi{fill:var(--info-bg);stroke:var(--info);stroke-width:1.25}
.bxc{fill:var(--crit-bg);stroke:var(--crit);stroke-width:1.25} .bxm{fill:var(--mute-bg);stroke:var(--mute);stroke-width:1.25}
.bxd{fill:var(--paper);stroke:var(--line);stroke-width:1.25;stroke-dasharray:5 4}
.bxz{fill:none;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 4}
.ln{stroke:var(--line);stroke-width:1.5;fill:none} .lna{stroke:var(--accent);stroke-width:2.25;fill:none}
.lng{stroke:var(--good);stroke-width:2;fill:none} .lnw{stroke:var(--warn);stroke-width:2;fill:none}
.lnc{stroke:var(--crit);stroke-width:2;fill:none} .lnx{stroke:var(--crit);stroke-width:2;fill:none;stroke-dasharray:4 5}
.lnd{stroke:var(--line);stroke-width:1.25;fill:none;stroke-dasharray:6 5} .lnr{stroke:var(--rule);stroke-width:1;fill:none}
.fa{fill:var(--accent)} .fg{fill:var(--good)} .fl{fill:var(--line)} .fw{fill:var(--warn)} .fi{fill:var(--info)}
.fc{fill:var(--crit)} .fm{fill:var(--mute)} .fp{fill:var(--panel)} .fs{fill:var(--accent-soft)} .fpaper{fill:var(--paper)}
.mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}
</style>
<text x="24" y="38" class="t" font-size="20" font-weight="700" data-role="title">A reorg is a registry edit: the identity stays, one platform's answer changes</text>
<text x="24" y="66" class="tq" font-size="15">python3 bin/demo: one record, three platforms that share nothing else, one reorg.</text>
<rect x="20" y="98" width="284" height="330" rx="12" class="bxp"/>
<text x="36" y="126" class="t mono" font-size="14" font-weight="700">raven-03.descriptor.json</text>
<rect x="36" y="144" width="252" height="84" rx="8" class="bx"/>
<text x="50" y="170" class="t" font-size="15" font-weight="700">spine</text>
<text x="102" y="170" class="tq" font-size="14">born-as, in the cert</text>
<text x="50" y="194" class="t mono" font-size="14">uuid e7a9c75b…</text>
<text x="50" y="215" class="tg" font-size="14">never changes</text>
<rect x="36" y="242" width="252" height="160" rx="8" class="bx"/>
<text x="50" y="268" class="t" font-size="15" font-weight="700">edges</text>
<text x="104" y="268" class="tq" font-size="14">currently-is, registry</text>
<text x="50" y="294" class="tq mono" font-size="14">parent falcon-bde</text>
<text x="50" y="314" class="tq" font-size="14">closed at T</text>
<text x="50" y="346" class="ta mono" font-size="14" font-weight="700">parent condor-bde</text>
<text x="50" y="366" class="tq" font-size="14">open from T</text>
<text x="50" y="388" class="t" font-size="14">T: a registry edit, no new cert</text>
<text x="342" y="116" class="tq" font-size="14" font-weight="700">platform</text>
<text x="538" y="116" class="tq" font-size="14" font-weight="700">before T</text>
<text x="708" y="116" class="tq" font-size="14" font-weight="700">after T</text>
<rect x="328" y="130" width="532" height="66" rx="8" class="bx"/>
<text x="342" y="157" class="t" font-size="14" font-weight="700">A: Zenoh fabric</text>
<text x="342" y="179" class="tq" font-size="14">reads spine.uuid</text>
<text x="538" y="157" class="t" font-size="14">write e7a9c75b…/**</text>
<text x="708" y="157" class="t" font-size="14">write e7a9c75b…/**</text>
<text x="708" y="179" class="tg" font-size="14">unchanged</text>
<rect x="328" y="206" width="532" height="66" rx="8" class="bx"/>
<text x="342" y="233" class="t" font-size="14" font-weight="700">B: analytics service</text>
<text x="342" y="255" class="tq" font-size="14">reads grammar.role</text>
<text x="538" y="233" class="t" font-size="14">OPERATOR: ALLOW</text>
<text x="708" y="233" class="t" font-size="14">OPERATOR: ALLOW</text>
<text x="708" y="255" class="tg" font-size="14">unchanged</text>
<rect x="328" y="282" width="532" height="66" rx="8" class="bxw"/>
<text x="342" y="309" class="t" font-size="14" font-weight="700">C: partner C2</text>
<text x="342" y="331" class="tq" font-size="14">reads affiliation graph</text>
<text x="538" y="309" class="t" font-size="14">releasable: no</text>
<text x="708" y="309" class="tw" font-size="14" font-weight="700">releasable: YES</text>
<text x="708" y="331" class="tw" font-size="14">changed</text>
<rect x="328" y="358" width="532" height="70" rx="8" class="bxa"/>
<text x="342" y="386" class="t" font-size="14" font-weight="700">Who was the parent at an audit event before T?</text>
<text x="342" y="408" class="tq" font-size="14">The same record answers falcon-bde, not the current parent.</text>
</svg>
