# The weekly changelog, generated with no person or model in the loop.
#
# Every Monday this reads the pull requests merged in every public repository
# of the organization during the last full ISO week (Monday 00:00 UTC to the
# next Monday 00:00 UTC), renders docs/changelog/weekly/<year>-W<week>.md from
# their titles, and opens a pull request that adds the page. With the secret
# CHANGELOG_TOKEN set, the run merges it when every check has passed; without
# it, an owner opens or merges it.
#
#   .github/changelog/collect.py   reads the repositories (through gh)
#   .github/changelog/weekly.py    renders the page; the same input always
#                                  gives the same page
#   .github/changelog/propose.py   commits through the GitHub API, so GitHub
#                                  signs the commit, and opens the pull request
#
# Run it by hand for any week: Actions > changelog-weekly > Run workflow, with
# a week such as 2026-W45.
#
# Who opens the pull request. The workflow always commits the page to the branch
# changelog/weekly-<week>. Then, with the default GITHUB_TOKEN:
#   - where the organization lets Actions open pull requests, it opens one, and
#     an owner closes and reopens it once so the required checks run (GitHub
#     starts no workflows for events the default token causes);
#   - where the organization does not, it opens an issue carrying the link an
#     owner clicks to open the pull request. A pull request a person opens
#     runs its checks at once.
# Set the repository secret CHANGELOG_TOKEN (a GitHub App installation token,
# or a fine-grained token with contents and pull-requests write on this
# repository) and the run needs nobody: the workflow commits the page with its
# own token, opens the pull request with CHANGELOG_TOKEN so the required checks
# start, waits for every check, and squash-merges when all of them passed. A
# failed check leaves the pull request open and fails the run. Without the
# secret, the two cases above apply.
name: changelog-weekly

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to generate, such as 2026-W45 (default: the last full week)"
        required: false
        default: "last"

permissions:
  contents: read

concurrency:
  group: changelog-weekly
  cancel-in-progress: false

jobs:
  weekly:
    name: weekly changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      WEEK: ${{ inputs.week || 'last' }}
      CHANGELOG_SIGNOFF: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: check the generator
        run: python3 -m unittest discover -s .github/changelog/tests

      - name: read the public repositories
        run: |
          python3 .github/changelog/collect.py \
            --org "${GITHUB_REPOSITORY_OWNER}" --week "${WEEK}" --out "${RUNNER_TEMP}/week.json"

      - name: render the page
        id: render
        run: |
          page="$(python3 .github/changelog/weekly.py "${RUNNER_TEMP}/week.json" --index docs/changelog/weekly/INDEX.md)"
          echo "page=${page}" >> "${GITHUB_OUTPUT}"
          echo "label=$(basename "${page}" .md)" >> "${GITHUB_OUTPUT}"

      - name: open the pull request
        env:
          CHANGELOG_PR_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
          PAGE: ${{ steps.render.outputs.page }}
          LABEL: ${{ steps.render.outputs.label }}
        run: |
          {
            echo "Adds \`${PAGE}\`, the weekly changelog for ${LABEL}."
            echo
            echo "Generated by \`.github/workflows/changelog-weekly.yml\` from the titles of pull requests merged in the public repositories. Nobody wrote or edited the page. To change how it reads, change \`.github/changelog/weekly.py\` and run the workflow again for this week."
          } > "${RUNNER_TEMP}/body.md"
          python3 .github/changelog/propose.py \
            --branch "changelog/weekly-${LABEL}" \
            --title "docs(changelog): weekly changelog ${LABEL}" \
            --body-file "${RUNNER_TEMP}/body.md" \
            --merge-on-green \
            "${PAGE}" docs/changelog/weekly/INDEX.md
