# The goatdocs website on GitHub Pages.
#
# Every pull request that touches the site's sources builds it (the build job
# only); a push to main builds it and deploys it. The site is mkdocs.yml plus
# docs/, built with MkDocs and the Material theme at the versions in
# .github/pages/requirements.txt. Deploying needs Settings > Pages > Source set
# to "GitHub Actions".
name: pages

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/pages/requirements.txt

      - name: install MkDocs
        run: python -m pip install --quiet -r .github/pages/requirements.txt

      - name: build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --clean

      - name: configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
